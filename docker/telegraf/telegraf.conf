# =====================================================================
#  ПР №9. Telegraf в Docker на ПК с Linux — метрики хоста через /hostfs
# =====================================================================

[global_tags]
  platform = "linux"

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "5s"
  precision = "1s"
  skip_processors_after_aggregators = true
  omit_hostname = false        # network_mode: host => тег host = имя компьютера

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]   # порт InfluxDB опубликован на хосте
  token = "${INFLUX_TOKEN}"
  organization = "MPT"
  bucket = "Metrix"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  report_active = true

[[inputs.mem]]

[[inputs.swap]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs", "nsfs", "efivarfs"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

# Процессы: total, running, sleeping, total_threads ...
[[inputs.processes]]

# Ядро: context_switches, boot_time, interrupts ...
[[inputs.kernel]]

# Сведения об устройстве: ОС, версия, часовой пояс, CPU, ОЗУ
[[inputs.exec]]
  commands = [["/bin/bash", "/etc/telegraf/device_info.sh"]]
  timeout = "10s"
  interval = "60s"
  data_format = "influx"

# Переключения контекста в Linux — счётчик; переводим в "в секунду",
# чтобы дашборд показывал то же, что и в Windows (processes.context_switches)
[[processors.starlark]]
  namepass = ["kernel"]
  source = '''
state = {}
def apply(metric):
    v = metric.fields.get("context_switches")
    if v == None:
        return metric
    t = metric.time
    prev = state.get("cs")
    state["cs"] = (v, t)
    if prev == None or t <= prev[1]:
        return metric
    rate = (v - prev[0]) / ((t - prev[1]) / 1e9)
    m = Metric("processes")
    m.tags["host"] = metric.tags.get("host", "")
    m.tags["platform"] = metric.tags.get("platform", "")
    m.fields["context_switches"] = float(rate)
    m.time = t
    return [metric, m]
'''
