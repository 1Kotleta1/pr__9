apiVersion: 1

# Автоматическая загрузка дашборда ПР9 из JSON-файла.
# DASHBOARDS_DIR — папка с JSON (Windows: ...\pr9\grafana\dashboards, Docker: /var/lib/grafana/dashboards)
providers:
  - name: pr9
    orgId: 1
    folder: ПР9
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: ${DASHBOARDS_DIR}
